[package]
name = "oe-cli"
description = "Command-line tool for the ownership engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "oe"
path = "src/main.rs"

[features]
default = ["net", "db"]
net = ["oe-edgar/net"]
# PostgreSQL ledger commands (db-migrate, db-load, db-status).
db = ["dep:oe-store"]

[dependencies]
oe-core.workspace = true
oe-form4.workspace = true
oe-form144.workspace = true
oe-events.workspace = true
oe-edgar.workspace = true
oe-store = { workspace = true, optional = true }
