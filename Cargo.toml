[workspace]
resolver = "2"
members = [
    "crates/oe-core",
    "crates/oe-form4",
    "crates/oe-form144",
    "crates/oe-item408",
    "crates/oe-sched13",
    "crates/oe-ledger",
    "crates/oe-events",
    "crates/oe-edgar",
    "crates/oe-store",
    "crates/oe-bulk",
    "crates/oe-alerts",
    "crates/oe-officials",
    "crates/oe-cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
# The dependencies need 1.88 (icu_* through ureq's url, sha2 through postgres);
# CI checks the workspace builds with exactly this version.
rust-version = "1.88"
repository = "https://github.com/MaxMil45/Ownership"

[workspace.dependencies]
oe-core = { path = "crates/oe-core" }
oe-form4 = { path = "crates/oe-form4" }
oe-form144 = { path = "crates/oe-form144" }
oe-item408 = { path = "crates/oe-item408" }
oe-sched13 = { path = "crates/oe-sched13" }
oe-ledger = { path = "crates/oe-ledger" }
oe-events = { path = "crates/oe-events" }
oe-store = { path = "crates/oe-store" }
oe-bulk = { path = "crates/oe-bulk" }
oe-alerts = { path = "crates/oe-alerts", default-features = false }
oe-officials = { path = "crates/oe-officials" }
oe-edgar = { path = "crates/oe-edgar", default-features = false }
