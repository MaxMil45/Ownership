name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint without network and database support
        run: cargo clippy -p oe-cli --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build without network support
        run: cargo build --workspace --no-default-features

  # The oe-store tests that need a server (`#[ignore]`d in the normal run).
  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oe
          POSTGRES_PASSWORD: oe_ci_only
          POSTGRES_DB: ownership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OE_TEST_DATABASE_URL: postgres://oe:oe_ci_only@localhost:5432/ownership_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Database tests
        run: cargo test -p oe-store --test postgres -- --ignored --test-threads=1

  # The version declared as `rust-version` in Cargo.toml. `+1.88` overrides
  # rust-toolchain.toml, which asks for the latest stable.
  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check with Rust 1.88
        run: cargo +1.88 check --workspace --all-targets

  # The local web app (web/): types, tests and a production build.
  web:
    name: web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types, tests and build
        run: npm run build && npm test

  extension:
    name: browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Types, tests and build
        run: npm run build && npm test

  # Known vulnerabilities in the Rust crates (RustSec) and the web app's npm
  # packages. Fails the build when one is found.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust crates
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm packages
        working-directory: web
        run: npm audit --audit-level=moderate
      - name: npm packages (extension)
        working-directory: extension
        run: npm audit --audit-level=moderate
